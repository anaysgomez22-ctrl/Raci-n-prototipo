<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RACIÓN – Prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--t1:#8CE0D6;--t2:#28C2B0;--p:#FF2E63;--k:#0F1E24}
*{box-sizing:border-box;margin:0;font-family:'Archivo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;scrollbar-width:none;color:var(--k)}
::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:#dfe6e8;display:flex;align-items:center;justify-content:center}
.ph{width:393px;height:852px;border-radius:44px;box-shadow:0 0 0 10px #0F1E24;background:#fff;position:relative;overflow:hidden;flex:none;margin:20px}
.sb{position:absolute;top:0;left:0;right:0;height:30px;display:flex;justify-content:space-between;padding:8px 28px 0;font-size:13px;font-weight:800;z-index:20;pointer-events:none}
.hi{position:absolute;bottom:6px;left:50%;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:#0F1E24;z-index:20;pointer-events:none}
@media(max-width:500px){.ph{width:100vw;height:100dvh;box-shadow:none;border-radius:0;margin:0}}
#m{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.hd{flex:none;background:var(--t1);border-bottom:2px solid var(--t2);height:143px;padding:56px 30px 16px;display:flex;align-items:center;gap:8px}
.hd h1{flex:1;text-align:center;font-size:28px;line-height:1.05;font-weight:800}
.cb{width:41px;height:41px;flex:none;border:0;background:none;padding:0;cursor:pointer}.cb img{width:100%;height:100%;display:block}.sm img{width:18px;height:18px}
.bd{flex:1;overflow-y:auto;padding:22px 26px}
.bt{flex:none;display:flex;gap:6px;background:var(--t1);border-top:2px solid var(--t2);height:97px;justify-content:space-around;padding:16px 14px 0}
.tb{border:0;background:none;border-radius:8px;width:82px;height:82px;margin-top:-4px;font-weight:800;font-size:11px;color:#0F1E24;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tb.on{background:var(--t2)}.tb img{height:42px;flex:none}
.cd,.bn{background:var(--t1);border:2px solid var(--t2);border-radius:18px;box-shadow:4px 4px 0 var(--t2);padding:14px;margin:0 4px 22px 0}
.bn{width:calc(100% - 4px);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:center}
.bn.l{justify-content:flex-start}.bn.s{font-size:17px;font-weight:500;padding:0 14px;height:52px;margin-bottom:22px}
.bn.pk{background:#FF9AB3;border-color:var(--p);box-shadow:4px 4px 0 var(--p)}
.bn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--t2)}
.ic{width:38px;height:38px;flex:none}
.pi{width:46px;height:46px;flex:none;display:grid;place-items:center}.pi img{max-width:100%;max-height:100%}.th>img{width:100%;height:100%;object-fit:cover}.th>img.f{width:55%;height:auto}.lgi{display:block}
.ttl{background:var(--t1);border:2px solid var(--t2);box-shadow:4px 4px 0 var(--t2);border-radius:18px;padding:12px 16px;font-size:23px;font-weight:800;margin:0 4px 14px 0}
.lg{font-family:'Archivo Black',sans-serif;color:var(--t2);-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 #000,2px 2px 0 #000;transform:rotate(-6deg) skewX(-4deg);display:inline-block;letter-spacing:1px}
.sp{position:absolute;inset:0;background:var(--p);display:grid;place-items:center;z-index:30}
.sp .lgi{width:300px;animation:z 1.2s ease-out forwards}
@keyframes z{from{transform:scale(.05)}to{transform:scale(1)}}
.op{display:flex;gap:14px;align-items:center;margin-bottom:16px;cursor:pointer;font-size:16px}
.ck{width:30px;height:30px;border-radius:6px;background:var(--t2);flex:none;display:grid;place-items:center;font-weight:900}.ck.on{background:var(--p)}
.pg{height:10px;border-radius:6px;background:var(--t1);border:2px solid var(--t2);margin:0 0 14px}.pg i{display:block;height:100%;background:var(--t2)}
input,select{width:100%;border:2px solid var(--p);border-radius:12px;padding:11px;font-size:16px;background:#fff;margin:4px 0 10px}
.ch{border:2px solid var(--t2);background:var(--t1);border-radius:20px;padding:7px 13px;font-weight:800;font-size:14px;cursor:pointer;margin:0 6px 8px 0;white-space:nowrap}.ch.on{background:var(--p);color:#fff;border-color:var(--p)}
.ch.on *{color:#fff}
.row{display:flex;gap:12px;align-items:center}.row>*{min-width:0}.sb2{justify-content:space-between}
.hs{display:flex;overflow-x:auto;margin-bottom:10px}
.dy{flex:none;width:62px;margin-right:10px;text-align:center;background:var(--t1);border-radius:14px;padding:8px 0;font-weight:800;font-size:18px;cursor:pointer;border:2px solid var(--t1)}.dy.on{border-color:var(--p)}
.ov{position:absolute;inset:0;background:rgba(15,30,36,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:25}
.pp{background:var(--t1);border:2px solid var(--t2);box-shadow:4px 4px 0 var(--t2);border-radius:22px;padding:18px;width:100%;max-height:88%;overflow:auto;position:relative}
.pp .x{position:absolute;top:10px;right:10px;width:34px;height:34px;font-size:18px}
.pp h2{margin:0 40px 8px 0;font-size:20px}
.th{width:92px;height:92px;flex:none;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.vl{width:2px;align-self:stretch;background:var(--p)}
.sw{width:58px;height:32px;border-radius:16px;background:var(--k);border:3px solid var(--t2);position:relative;flex:none;cursor:pointer}
.sw i{position:absolute;top:2px;left:3px;width:22px;height:22px;border-radius:8px;background:#186E6E;transition:.2s}.sw.on{border-color:var(--p)}.sw.on i{left:27px;background:var(--p)}
.sm{width:34px;height:34px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:18px;font-weight:900;cursor:pointer;flex:none}
.lk{text-decoration:underline dashed;cursor:pointer;font-weight:800;text-align:center;margin:10px 0}
.tg{display:flex;margin:0 4px 14px 0;border:2px solid var(--t2);border-radius:16px;overflow:hidden;background:var(--t1)}.tg b{flex:1;text-align:center;padding:12px;cursor:pointer}.tg b.on{background:var(--p);color:#fff}
.toast{position:absolute;bottom:110px;left:24px;right:24px;background:var(--k);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:800;z-index:40}
.big .bd{zoom:1.15}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-weight:800}.mg div{padding:8px 0;border-radius:10px;background:var(--t1);cursor:pointer}.mg .o{background:#eee}
body.dk{--k:#E6F4F2;--t1:#1B4B4F;background:#0a1417}.dk .ph,.dk #m,.dk .bd{background:#0F1E24}.dk input,.dk select{background:#16323A}.dk [style*="background:#fff"]{background:#16323A!important}.dk [style*="5FD0C4"]{background:#25706F!important}.dk .sw{background:#0a1417}.dk .ch.on,.dk .tg b.on{color:#fff}
body[data-fs="1"] .bd{zoom:1.12}body[data-fs="2"] .bd{zoom:1.25}
.hc .cd,.hc .bn,.hc .hd,.hc .bt,.hc .pp{border-color:var(--k)!important;border-width:3px}.hc *{font-weight:800}.rm *{animation:none!important;transition:none!important}
</style></head><body>

const FAQ=[['¿Cómo vinculo mi saldo BAES?','Ve a Saldo y registra tu saldo de Beca Baes en el onboarding o con un ingreso. Cada gasto elegido con “Beca Baes” lo descuenta automáticamente.'],['¿Cómo uso el Modo Guiado con voz?','Abre una receta, toca “Iniciar modo guiado” y presiona el botón rosa del parlante para escuchar el paso. En Accesibilidad puedes activar la lectura automática.'],['¿Cómo organizo mi despensa?','En la pestaña Despensa filtra por categoría, usa − y + para ajustar cantidades y “Agregar alimentos” para sumar productos nuevos.']];
const INF={'Acerca de Ración':'Ración es una app de autogestión alimentaria y financiera para estudiantes de educación superior en Chile: te ayuda a hacer rendir tu beca BAES (Junaeb) y tu dinero propio, aprovechar tu despensa, cocinar recetas económicas y planificar tu semana.<br><br><b>Versión:</b> v1.0 MVP (prototipo)<br><b>Créditos:</b> diseño UI/UX y prototipo del proyecto de título “Ración”.','Políticas de privacidad':'Tus datos de presupuesto, preferencias alimentarias y despensa se almacenan de forma privada y segura, y se usan solo para personalizar las recomendaciones que ves en la app. No se venden ni se comparten con terceros. Puedes restablecer o eliminar tus datos cuando quieras desde Seguridad.','Términos y condiciones':'Las recetas, tiempos, precios y ofertas son referenciales e informativos. La gestión de tu saldo es personal y no reemplaza información oficial de tu institución o de Junaeb. Al usar la app aceptas utilizarla de forma responsable.','Licencias y contacto':'Contacto del equipo de desarrollo: soporte@racion.app<br><br>Agradecimientos: a las y los estudiantes que participan en las pruebas de usabilidad, y a quienes comparten tips y ofertas en la comunidad. Fuentes tipográficas: Archivo (SIL Open Font License).'};

 else if(k=='amt'){S.amt=v.replace(/\D/g,'');const n=+S.amt;if(n){if(S.fin=='own'){S.own=n;S.baes=0}else if(S.fin=='baes'){S.baes=n;S.own=0}else{S.baes=Math.round(n*.9);S.own=n-S.baes}}}
 else if(k=='sa'){S.sa=+v.replace(/\D/g,'')||0;$('#amt').textContent=C(S.sa)}
 else{S[k]=v;if(k=='vol')$('#vv').textContent=v+'%'}});
draw();setTimeout(()=>{if(cur.s=='splash')nav('ob1',0,1)},1400);
</script></body></html>
